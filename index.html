<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sylheti Ludo 🎲</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div><h1>🎲 Sylheti Ludo</h1><p>জাফলং • রাতারগুল • ক্বীন ব্রিজ</p></div><div class="badge">সিলেটি আড্ডা 🎤</div></header><section class="controls"><button id="newGame">🔄 নতুন গেম</button><button id="voiceToggle">🔊 Voice ON</button><select id="mode"><option value="cpu">🤖 Computer-এর সাথে</option><option value="4p">👥 ৪ Player</option></select></section><div class="status" id="status"></div><div class="game"><canvas id="board" width="720" height="720"></canvas><aside><div class="turn" id="turn"></div><div class="dice" id="dice">🎲</div><button class="roll" id="roll">🎲 পাশা ফালাই!</button><div class="rules"><b>খেলার নিয়ম</b><p>৬ পেলে গুটি বের হবে। প্রতিপক্ষের গুটি কাটতে পারবে। ⭐ Safe spot-এ গুটি নিরাপদ। ৪টি গুটি Home = Winner.</p></div><div id="scores"></div></aside></div><footer>Made for a fun Sylhet-themed Ludo experience ❤️</footer></main><script src="game.js"></script></body></html>
